name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: skillescrow, POSTGRES_PASSWORD: skillescrow, POSTGRES_DB: skillescrow_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U skillescrow" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://skillescrow:skillescrow@localhost:5432/skillescrow_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26 }
      - run: npm i -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillescrow/contract-client build
      - run: pnpm --filter @skillescrow/api exec prisma generate
      - run: pnpm --filter @skillescrow/api exec prisma migrate deploy
      - run: pnpm audit --audit-level=high
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @skillescrow/web build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks dir . --redact --no-banner
